name: Test fail-check - ESLint errors cause workflow failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint project with errors
        run: |
          set -e
          PROJ="$GITHUB_WORKSPACE/eslint-fail-project"
          mkdir -p "$PROJ"
          cd "$PROJ"

          # Create a minimal package.json with ESM type
          cat > package.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "type": "module"
          }
          EOF

          # Install ESLint 10
          npm install eslint@^10.0.0 --save-dev --quiet 2>&1 | tail -5

          # Create a flat ESLint config that flags no-undef as error
          cat > eslint.config.js << 'EOF'
          export default [
            {
              rules: {
                "no-undef": "error"
              }
            }
          ];
          EOF

          # Create a JS file with lint errors (uses undefined variable)
          cat > bad.js << 'EOF'
          console.log(undefinedVariable);
          EOF

          echo "ESLint project with errors set up at $PROJ"

      - name: Run ESLint feedback action on code with errors (fail-check=true)
        id: action
        uses: .
        with:
          directory: '${{ github.workspace }}/eslint-fail-project'
          targets: 'bad.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'true'
          request-changes: 'false'
        continue-on-error: true

      - name: Assert action failed due to ESLint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ESLint finds errors with fail-check=true, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when ESLint found errors with fail-check=true"
