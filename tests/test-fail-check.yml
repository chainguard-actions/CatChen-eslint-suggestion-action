name: Test ESLint errors with fail-check enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ESLint in fixture directory
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-fail-check"
          npm install --save-dev eslint@9 --no-audit --no-fund

      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: './tests/fixtures/eslint-fail-check'
          targets: 'bad.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'true'
          request-changes: 'false'

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail-check=true and ESLint has errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when fail-check=true and ESLint found errors"
