name: Test fail-check mode - ESLint errors cause workflow failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint fixture directory with code that has errors
        run: |
          mkdir -p /tmp/eslint-fixture-fail
          cd /tmp/eslint-fixture-fail

          # Create a minimal package.json
          cat > package.json <<'PKGJSON'
          {
            "name": "eslint-fixture-fail",
            "version": "1.0.0",
            "type": "commonjs"
          }
          PKGJSON

          # Install ESLint 8
          npm install --save-dev eslint@8 2>&1 | tail -5

          # Create a JS file with ESLint errors (using undefined variable)
          cat > bad.js <<'JSEOF'
          console.log(undefinedVariable);
          JSEOF

          # Create ESLint config that errors on no-undef
          cat > .eslintrc.json <<'ESLINTEOF'
          {
            "env": { "node": true },
            "rules": {
              "no-undef": "error"
            }
          }
          ESLINTEOF

          echo "Fixture directory ready:"
          ls -la /tmp/eslint-fixture-fail/

      - name: Run ESLint action with fail-check=true on bad code
        id: action
        uses: .
        continue-on-error: true
        with:
          directory: /tmp/eslint-fixture-fail
          targets: bad.js
          eslint-lib-path: ./node_modules/eslint/lib/api.js
          config-path: ./.eslintrc.json
          fail-check: true
          request-changes: false

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail-check=true and ESLint errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when ESLint found errors with fail-check=true"
