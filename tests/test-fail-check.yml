name: Test fail-check causes workflow failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ESLint in fail fixture project directory
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-project-fail"
          npm install --save-dev eslint @eslint/js --no-audit --no-fund

      - name: Run ESLint action with fail-check enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          directory: './tests/fixtures/eslint-project-fail'
          targets: 'error.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'true'
          request-changes: 'false'

      - name: Assert action failed due to ESLint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fail-check=true and ESLint finds errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when fail-check=true and ESLint found errors"
