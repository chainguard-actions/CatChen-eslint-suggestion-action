name: Test missing ESLint library
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal project without ESLint installed
        run: |
          mkdir -p /tmp/eslint-missing-project
          cd /tmp/eslint-missing-project
          echo '{"name":"test","version":"1.0.0","type":"module"}' > package.json
          # Do NOT install eslint - we want to test the missing ESLint case
          printf '%s\n' \
            'const x = 1;' \
            'console.log(x);' > index.js

      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: '/tmp/eslint-missing-project'
          targets: 'index.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action failed due to missing ESLint
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ESLint is not installed, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when ESLint library was not found"
