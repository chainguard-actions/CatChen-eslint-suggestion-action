name: Test missing ESLint - action fails when ESLint library not found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ESLint action with missing ESLint library
        id: action
        continue-on-error: true
        uses: .
        with:
          directory: ${{ github.workspace }}
          targets: tests/fixtures/clean.js
          eslint-lib-path: /nonexistent/path/to/eslint/lib/api.js
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action failed due to missing ESLint
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ESLint is not installed, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when ESLint library was not found"
