name: Test ESLint missing library error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: './tests/fixtures/eslint-missing'
          targets: '.'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action failed due to missing ESLint
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ESLint is not installed, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when ESLint library is not found"
