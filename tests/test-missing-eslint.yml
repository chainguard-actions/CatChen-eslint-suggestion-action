name: Test missing ESLint library fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: tests/fixtures/eslint-project
          targets: src/clean.js
          eslint-lib-path: ./does-not-exist/eslint/lib/api.js
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when ESLint library is missing"
            exit 1
          fi
          echo "PASS"
