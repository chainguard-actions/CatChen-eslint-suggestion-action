name: Test ESLint not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up empty fixture directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/eslint-missing"
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-missing"

          # Create a minimal package.json but do NOT install ESLint
          cat > package.json << 'EOF'
          {
            "name": "eslint-missing-fixture",
            "version": "1.0.0",
            "private": true
          }
          EOF

          # Create a JS file to lint
          cat > sample.js << 'EOF'
          'use strict';
          module.exports = {};
          EOF

          echo "Fixture setup complete (no ESLint installed)"
          ls -la

      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: tests/fixtures/eslint-missing
          targets: 'sample.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action failed because ESLint was not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when ESLint library was not found"
          else
            echo "FAIL: expected action to fail when ESLint is not installed, but got outcome '$OUTCOME'"
            exit 1
          fi
