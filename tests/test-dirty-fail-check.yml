name: Test lint errors fail the step when fail-check is true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install ESLint into fixture project
        working-directory: tests/fixtures/eslint-project
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund eslint@9
          test -f node_modules/eslint/lib/api.js
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: tests/fixtures/eslint-project
          targets: src/dirty.js
          fail-check: 'true'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on file with lint errors"
            exit 1
          fi
          echo "PASS"
