name: Test - Clean code passes ESLint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js and install ESLint
        run: |
          node --version
          npm --version
          # Create a temporary project directory with ESLint installed
          mkdir -p /tmp/eslint-test
          cd /tmp/eslint-test
          npm init -y
          npm install eslint@9 --save-dev
          # Create a clean JS file to lint
          cat > clean.js << 'EOF'
          // A clean JavaScript file with no ESLint violations
          const greeting = 'hello';
          console.log(greeting);
          EOF
          # Create a minimal flat ESLint config using CommonJS syntax
          cat > eslint.config.js << 'EOF'
          module.exports = [
            {
              rules: {
                'no-unused-vars': 'warn',
              },
            },
          ];
          EOF

      - id: action
        uses: .
        with:
          directory: '/tmp/eslint-test'
          targets: 'clean.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with clean code"
          else
            echo "FAIL: action should have succeeded with clean code, got '$OUTCOME'"
            exit 1
          fi
