name: Test custom directory and targets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ESLint in custom directory fixture
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-custom-dir"
          npm install --save-dev eslint @eslint/js --no-audit --no-fund

      - name: Run ESLint action with custom directory
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          directory: './tests/fixtures/eslint-custom-dir'
          targets: 'src'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action completed successfully with custom directory
        run: |
          echo "Action completed with custom directory and targets"
          echo "PASS: ESLint ran successfully on custom directory"
