name: Test ESLint errors without fail-check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint project with code that has errors
        run: |
          mkdir -p /tmp/eslint-error-project
          cd /tmp/eslint-error-project
          # Use type:module so ESM flat config works
          echo '{"name":"test","version":"1.0.0","type":"module"}' > package.json
          npm install eslint@9 --save-dev
          # Create a flat config file (ESM) with node globals
          printf '%s\n' \
            'import js from "@eslint/js";' \
            'export default [' \
            '  js.configs.recommended,' \
            '  {' \
            '    languageOptions: {' \
            '      globals: { console: "readonly", process: "readonly" }' \
            '    }' \
            '  }' \
            '];' > eslint.config.js
          # Create JS file with ESLint errors (no-undef: using undeclared variable)
          printf '%s\n' \
            'var x = undeclaredVariable;' \
            'console.log(x);' > bad.js

      - id: action
        uses: .
        with:
          directory: '/tmp/eslint-error-project'
          targets: 'bad.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action completed without failing workflow
        run: |
          echo "Action completed without throwing (fail-check=false)"
          echo "PASS"
