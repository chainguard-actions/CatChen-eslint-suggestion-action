name: Test lint errors without fail-check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install ESLint in fixture project
        working-directory: tests/fixtures/eslint-project
        run: npm install --no-audit --no-fund --no-package-lock
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: tests/fixtures/eslint-project
          targets: bad
          fail-check: 'false'
      - name: Assert action did not fail the step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when fail-check=false even with lint errors"
            exit 1
          fi
          echo "PASS"
