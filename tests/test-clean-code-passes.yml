name: Test clean code passes with fail-check enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare ESLint project
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.eslint-test-clean"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/eslint-clean" "$GITHUB_WORKSPACE/.eslint-test-clean"
          cd "$GITHUB_WORKSPACE/.eslint-test-clean"
          npm install --no-save --no-audit --no-fund --no-package-lock eslint@9
          test -f node_modules/eslint/lib/api.js
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ./.eslint-test-clean
          fail-check: 'true'
      - name: Assert action succeeded on clean code
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success on lint-clean code with fail-check=true"
            exit 1
          fi
          echo "PASS"
