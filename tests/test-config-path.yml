name: Test custom config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ESLint in config-path fixture project
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-config-path-project"
          npm install --save-dev eslint --no-audit --no-fund

      - name: Run ESLint action with custom config-path
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          directory: './tests/fixtures/eslint-config-path-project'
          targets: 'clean.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          config-path: './custom.eslint.config.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action completed successfully with custom config-path
        run: |
          echo "Action completed with custom config-path"
          echo "PASS: ESLint ran successfully using the custom config-path input"
