name: Test config-path input - custom ESLint config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint fixture with custom config path
        run: |
          mkdir -p /tmp/config-path-fixture/configs
          cd /tmp/config-path-fixture

          # Create a minimal package.json
          cat > package.json <<'PKGJSON'
          {
            "name": "config-path-fixture",
            "version": "1.0.0",
            "type": "commonjs"
          }
          PKGJSON

          # Install ESLint 8
          npm install --save-dev eslint@8 2>&1 | tail -5

          # Create a clean JS file to lint
          cat > app.js <<'JSEOF'
          var value = 42;
          console.log(value);
          JSEOF

          # Create a custom ESLint config at a non-default path
          cat > configs/custom.eslintrc.json <<'ESLINTEOF'
          {
            "env": { "node": true },
            "rules": {
              "no-undef": "error"
            }
          }
          ESLINTEOF

          echo "Config-path fixture ready:"
          ls -la /tmp/config-path-fixture/
          ls -la /tmp/config-path-fixture/configs/

      - name: Run ESLint action with custom config-path
        id: action
        uses: .
        with:
          directory: /tmp/config-path-fixture
          targets: app.js
          eslint-lib-path: ./node_modules/eslint/lib/api.js
          config-path: ./configs/custom.eslintrc.json
          fail-check: false
          request-changes: false

      - name: Assert action completed successfully with custom config path
        run: |
          echo "Action completed with custom config-path - PASS"
