name: Test custom config-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install ESLint in fixture project
        working-directory: tests/fixtures/eslint-project
        run: npm install --no-audit --no-fund --no-package-lock
      # src/clean.js passes the default config but uses console.log,
      # which strict.config.mjs forbids (no-console: error).
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: tests/fixtures/eslint-project
          targets: src
          config-path: strict.config.mjs
          fail-check: 'true'
      - name: Assert strict config was applied (action failed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because strict config forbids console"
            exit 1
          fi
          echo "PASS"
