name: Test custom config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint fixture with custom config path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/eslint-custom-config"
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-custom-config"

          # Create a minimal package.json
          cat > package.json << 'EOF'
          {
            "name": "eslint-custom-config-fixture",
            "version": "1.0.0",
            "private": true
          }
          EOF

          # Install ESLint
          npm install --save-dev eslint@8 2>&1 | tail -5

          # Create a clean JS file (no lint errors)
          cat > clean.js << 'EOF'
          'use strict';

          function add(a, b) {
            return a + b;
          }

          module.exports = { add };
          EOF

          # Create a custom config file at a non-default path
          mkdir -p custom-configs
          cat > custom-configs/my-eslint.config.js << 'EOF'
          module.exports = [
            {
              files: ['**/*.js'],
              rules: {
                'no-unused-vars': 'warn',
                'no-undef': 'error',
              },
            },
          ];
          EOF

          echo "Fixture setup complete"
          ls -la
          ls -la custom-configs/

      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: tests/fixtures/eslint-custom-config
          targets: 'clean.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          config-path: './custom-configs/my-eslint.config.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action ran with custom config-path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (ESLint ran with custom config) or fail gracefully
          # (e.g. sentinel repo API call fails). Either way, it must not be skipped.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config-path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom config-path (failed gracefully, likely sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
