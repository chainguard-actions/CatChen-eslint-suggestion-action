name: Test lint errors do not fail the step when fail-check is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare ESLint project
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.eslint-test-nofail"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/eslint-dirty" "$GITHUB_WORKSPACE/.eslint-test-nofail"
          cd "$GITHUB_WORKSPACE/.eslint-test-nofail"
          npm install --no-save --no-audit --no-fund --no-package-lock eslint@9
          test -f node_modules/eslint/lib/api.js
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ./.eslint-test-nofail
          fail-check: 'false'
      - name: Assert action succeeded despite lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (annotations only) when fail-check=false"
            exit 1
          fi
          echo "PASS"
