name: Test - ESLint not found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Point to a non-existent ESLint lib path to trigger the "not found" error
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          targets: '.'

      - name: Assert action failed due to missing ESLint
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when ESLint is not installed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when ESLint is not found"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
