name: Test - No ESLint installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no node_modules/eslint present
        run: |
          rm -rf node_modules

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          targets: '.'

      - name: Assert action failed gracefully when ESLint not found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when ESLint is not installed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when ESLint is not installed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
