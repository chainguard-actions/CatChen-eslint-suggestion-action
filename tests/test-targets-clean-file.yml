name: Test targets input limits linting to a clean file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare ESLint project
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.eslint-test-targets"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/eslint-dirty" "$GITHUB_WORKSPACE/.eslint-test-targets"
          cd "$GITHUB_WORKSPACE/.eslint-test-targets"
          npm install --no-save --no-audit --no-fund --no-package-lock eslint@9
          test -f node_modules/eslint/lib/api.js
      # Project contains bad.js, but only clean.js is targeted, so it must pass
      # even with fail-check enabled.
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ./.eslint-test-targets
          targets: clean.js
          fail-check: 'true'
      - name: Assert action succeeded when targeting only the clean file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when only clean.js is targeted"
            exit 1
          fi
          echo "PASS"
