name: Test basic usage - ESLint passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint project with clean code
        run: |
          mkdir -p /tmp/eslint-test-project
          cd /tmp/eslint-test-project
          # Use type:module so ESM flat config works
          echo '{"name":"test","version":"1.0.0","type":"module"}' > package.json
          npm install eslint@9 --save-dev
          # Create a flat config file (ESM) with node globals
          printf '%s\n' \
            'import js from "@eslint/js";' \
            'export default [' \
            '  js.configs.recommended,' \
            '  {' \
            '    languageOptions: {' \
            '      globals: { console: "readonly", process: "readonly" }' \
            '    }' \
            '  }' \
            '];' > eslint.config.js
          # Create clean JS file (no ESLint errors)
          printf '%s\n' \
            'const x = 1;' \
            'console.log(x);' > index.js

      - id: action
        uses: .
        with:
          directory: '/tmp/eslint-test-project'
          targets: 'index.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully (ESLint passed)"
          echo "PASS"
