name: Test basic usage with clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint fixture directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/eslint-clean"
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-clean"

          # Create a minimal package.json
          cat > package.json << 'EOF'
          {
            "name": "eslint-test-fixture",
            "version": "1.0.0",
            "private": true
          }
          EOF

          # Install ESLint
          npm install --save-dev eslint@8 2>&1 | tail -5

          # Create a clean JS file (no lint errors)
          cat > clean.js << 'EOF'
          'use strict';

          function greet(name) {
            return 'Hello, ' + name + '!';
          }

          module.exports = { greet };
          EOF

          # Create a flat ESLint config (eslint.config.js for ESLint 8 flat config)
          cat > eslint.config.js << 'EOF'
          module.exports = [
            {
              files: ['**/*.js'],
              rules: {
                'no-unused-vars': 'warn',
                'no-undef': 'error',
              },
            },
          ];
          EOF

          echo "Fixture setup complete"
          ls -la

      - id: action
        uses: .
        with:
          directory: tests/fixtures/eslint-clean
          targets: 'clean.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action completed successfully
        run: |
          echo "Action completed - ESLint ran on clean code"
          echo "PASS: action ran without error on clean code"
