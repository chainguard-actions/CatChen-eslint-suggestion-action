name: Test basic usage with clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js project with ESLint
        run: |
          mkdir -p /tmp/eslint-test-project
          cd /tmp/eslint-test-project
          cat > package.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "type": "module"
          }
          EOF
          npm install --save-dev eslint@9 2>&1 | tail -5
          # Create a clean JS file to lint
          cat > clean.js << 'EOF'
          const x = 1;
          console.log(x);
          EOF
          # Create a minimal flat config
          cat > eslint.config.js << 'EOF'
          import js from "@eslint/js";
          export default [js.configs.recommended];
          EOF

      - id: action
        uses: .
        with:
          directory: /tmp/eslint-test-project
          targets: clean.js
          eslint-lib-path: ./node_modules/eslint/lib/api.js
          fail-check: false
          request-changes: false
          github-token: fake-token-for-local-test

      - name: Assert action completed successfully
        run: |
          echo "Action completed without failure"
          echo "PASS"
