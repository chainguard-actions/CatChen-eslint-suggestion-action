name: Test - ESLint violations with fail-check true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js and install ESLint with violations
        run: |
          node --version
          npm --version
          mkdir -p /tmp/eslint-fail-test
          cd /tmp/eslint-fail-test
          npm init -y
          npm install eslint@9 --save-dev
          # Create a JS file with ESLint errors (no-undef)
          cat > bad.js << 'EOF'
          console.log(undeclaredVariable);
          EOF
          # Create a minimal flat ESLint config that errors on undefined vars
          cat > eslint.config.js << 'EOF'
          export default [
            {
              rules: {
                'no-undef': 'error',
              },
            },
          ];
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: '/tmp/eslint-fail-test'
          targets: 'bad.js'
          eslint-lib-path: './node_modules/eslint/lib/api.js'
          fail-check: 'true'
          request-changes: 'false'

      - name: Assert action failed due to ESLint errors with fail-check true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when ESLint errors found and fail-check is true"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when ESLint errors found and fail-check is true"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
