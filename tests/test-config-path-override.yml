name: Test config-path overrides the project ESLint config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare ESLint project
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.eslint-test-config"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/eslint-dirty" "$GITHUB_WORKSPACE/.eslint-test-config"
          cd "$GITHUB_WORKSPACE/.eslint-test-config"
          npm install --no-save --no-audit --no-fund --no-package-lock eslint@9
          test -f node_modules/eslint/lib/api.js
      # The default eslint.config.mjs flags bad.js; permissive.config.mjs has
      # no rules, so with config-path set the run must pass under fail-check.
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ./.eslint-test-config
          config-path: permissive.config.mjs
          fail-check: 'true'
      - name: Assert permissive config was used
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with permissive config-path override"
            exit 1
          fi
          echo "PASS"
