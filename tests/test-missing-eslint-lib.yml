name: Test missing ESLint library path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ESLint action with non-existent eslint-lib-path
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          directory: './tests/fixtures/eslint-project'
          targets: 'clean.js'
          eslint-lib-path: './node_modules/nonexistent-eslint/lib/api.js'
          fail-check: 'false'
          request-changes: 'false'

      - name: Assert action failed due to missing ESLint library
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ESLint library is not found, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when ESLint library path does not exist"
